
<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <title>Visualiser 2026</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            position: fixed;
            width: 100%;
            height: 100%;
            inset: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #231F20;
        }

        #unity-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #unity-progress-bar {
            width: 300px;
            height: 8px;
            background: #444;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
        }

        #unity-progress-fill {
            width: 0%;
            height: 100%;
            background: #4CAF50;
            transition: width 0.15s;
        }
    </style>
</head>

<body>

    <div id="unity-container">

        <canvas id="unity-canvas"
                width="1920"
                height="1080"
                tabindex="-1">
        </canvas>

        <div id="unity-loading">
            <div>Loading Visualiser 2026...</div>

            <div id="unity-progress-bar">
                <div id="unity-progress-fill"></div>
            </div>
        </div>

    </div>

    <script>
        var canvas = document.querySelector("#unity-canvas");
        var loading = document.querySelector("#unity-loading");
        var progressFill = document.querySelector("#unity-progress-fill");

        var gameInstance = null;

        var buildUrl = "Build";

        var loaderUrl = buildUrl + "/Visualiser 2026 15_10_2026 1041.loader.js";

        var config = {
            dataUrl: buildUrl + "/Visualiser 2026 15_10_2026 1041.data.gz",
            frameworkUrl: buildUrl + "/Visualiser 2026 15_10_2026 1041.framework.js.gz",
            codeUrl: buildUrl + "/Visualiser 2026 15_10_2026 1041.wasm.gz",



            streamingAssetsUrl: "StreamingAssets",

            companyName: "Cavill Pte Ltd",
            productName: "Visualiser 2026",
            productVersion: "0.1.0",

            showBanner: function(message, type) {
            }
        };

        // ==========================================
        // Receive messages from parent webpage
        // ==========================================

window.addEventListener("message", function(event) {

			if (gameInstance === null)
				return;

			let command;

			try {
				command = typeof event.data === "string"
					? JSON.parse(event.data)
					: event.data;
			}
			catch (error) {
				return;
			}

			// Validate command structure
			if (!command || typeof command !== "object")
				return;

			if (typeof command.type !== "string")
				return;

			if (!Object.prototype.hasOwnProperty.call(command, "data"))
				return;

			// Forward command to Unity
			gameInstance.SendMessage(
				"WebGLTranslator",
				"RecieveCommand",
				JSON.stringify({
					type: command.type,
					data: command.data
				})
			);
		});

        // ==========================================
        // Initialize Unity WebGL
        // ==========================================

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            canvas.style.width = "100%";
            canvas.style.height = "100%";
        }

        var script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = function() {

            createUnityInstance(canvas, config, function(progress) {

                progressFill.style.width =
                    (progress * 100) + "%";

            }).then(function(unityInstance) {

                gameInstance = unityInstance;

                loading.style.display = "none";


            }).catch(function(error) {


                loading.innerHTML =
                    "Failed to load Unity WebGL.";

            });
        };

        script.onerror = function() {
            loading.innerHTML =
                "Failed to load Unity WebGL loader.";
        };

        document.body.appendChild(script);
    </script>

</body>
</html>
